<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" aria-labelledby="title" role="img" viewBox="0 0 1200 420"><title id="title">How token instructions update a mint and token accounts</title><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#566074" stroke-width="1.7" d="M1 1L9 5L1 9"/></marker></defs><style>.label{fill:#f4f6fb;font:600 22px Diatype,Helvetica,sans-serif}.meta{fill:#a6adbd;font:15px Diatype,Helvetica,sans-serif}.small{fill:#f4f6fb;font:600 16px Diatype,Helvetica,sans-serif}.both,.line{fill:none;stroke:#566074;stroke-width:2;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style><path d="M290 210H370" class="line"/><path d="M650 190H710V105H800" class="line"/><path d="M650 230H710V310H760" class="line"/><path d="M975 170V245" class="line"/><g><rect width="250" height="130" x="40" y="145" fill="#12151d" stroke="#9945ff" stroke-width="2" rx="16"/><text x="165" y="199" class="label" text-anchor="middle">Wallet or app</text><text x="165" y="229" class="meta" text-anchor="middle">Signs token instructions</text></g><g><rect width="280" height="130" x="370" y="145" fill="#12151d" stroke="#21d4fd" stroke-width="2" rx="16"/><text x="510" y="199" class="label" text-anchor="middle">Token Program</text><text x="510" y="229" class="meta" text-anchor="middle">Applies rules and updates state</text></g><g><rect width="350" height="130" x="800" y="40" fill="#12151d" stroke="#18d9ba" stroke-width="2" rx="16"/><text x="975" y="94" class="label" text-anchor="middle">Mint account</text><text x="975" y="124" class="meta" text-anchor="middle">Defines the asset, supply, and authorities</text></g><g><rect width="390" height="150" x="760" y="245" fill="#12151d" stroke="#14f195" stroke-width="2" rx="16"/><text x="955" y="283" class="label" text-anchor="middle">Token accounts</text><text x="955" y="307" class="meta" text-anchor="middle">Store owner balances for this mint</text><rect width="146" height="50" x="790" y="320" fill="none" stroke="#18d9ba" stroke-width="1.5" rx="12"/><text x="863" y="350" class="small" text-anchor="middle">Alice · 90</text><rect width="146" height="50" x="974" y="320" fill="none" stroke="#14f195" stroke-width="1.5" rx="12"/><text x="1047" y="350" class="small" text-anchor="middle">Bob · 10</text></g><path d="M936 345H974" class="both"/></svg>