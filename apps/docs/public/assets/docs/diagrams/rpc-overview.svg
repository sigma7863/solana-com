<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="154" aria-labelledby="title" role="img" viewBox="0 103 1200 154"><title id="title">Applications connect to Solana through RPC</title><style>.label{fill:#f4f6fb;font:600 23px Diatype,Helvetica,sans-serif}.meta{fill:#9299aa;font:15px Diatype,Helvetica,sans-serif}.route{font:600 12px Diatype,Helvetica,sans-serif;letter-spacing:.2px}.arrow,.line{fill:none;stroke:#566074;stroke-width:2}</style><path d="M270 180H370M590 180H660M880 180H950" class="line"/><path d="M280 173L270 180L280 187M360 173L370 180L360 187M650 173L660 180L650 187M940 173L950 180L940 187" class="arrow"/><text x="320" y="163" fill="#21d4fd" class="route" text-anchor="middle">HTTP</text><text x="320" y="211" fill="#14f195" class="route" text-anchor="middle">WebSocket</text><g><rect width="220" height="150" x="50" y="105" fill="#12151d" stroke="#9945ff" stroke-width="2" rx="16"/><text x="160" y="171" class="label" text-anchor="middle">Application</text><text x="160" y="201" class="meta" text-anchor="middle">client or backend</text></g><g><rect width="220" height="150" x="370" y="105" fill="#12151d" stroke="#21d4fd" stroke-width="2" rx="16"/><text x="480" y="171" class="label" text-anchor="middle">RPC endpoint</text><text x="480" y="201" class="meta" text-anchor="middle">requests + subscriptions</text></g><g><rect width="220" height="150" x="660" y="105" fill="#12151d" stroke="#18d9ba" stroke-width="2" rx="16"/><text x="770" y="171" class="label" text-anchor="middle">Validator</text><text x="770" y="201" class="meta" text-anchor="middle">reads + sends</text></g><g><rect width="200" height="150" x="950" y="105" fill="#12151d" stroke="#14f195" stroke-width="2" rx="16"/><text x="1050" y="171" class="label" text-anchor="middle">Network</text><text x="1050" y="201" class="meta" text-anchor="middle">accounts + programs</text></g></svg>