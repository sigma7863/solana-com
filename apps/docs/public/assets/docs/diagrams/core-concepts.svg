<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" aria-labelledby="title" role="img" viewBox="0 0 1200 480"><title id="title">How Solana accounts, programs, instructions, transactions, PDAs, CPIs, and fees relate</title><style>.label{fill:#f4f6fb;font:600 23px Diatype,Helvetica,sans-serif}.label-small{fill:#f4f6fb;font:600 19px Diatype,Helvetica,sans-serif}.meta{fill:#a2a9b8;font:16px Diatype,Helvetica,sans-serif}.edge{fill:#788195;font:600 12px Diatype,Helvetica,sans-serif;letter-spacing:.3px}.arrow,.line{fill:none;stroke:#566074;stroke-width:2}</style><path d="M290 140H370M805 205H690V140H630M440 205V265H160V335M560 205V335M960 315V355" class="line"/><path d="M300 133L290 140L300 147M360 133L370 140L360 147M640 133L630 140L640 147M153 325L160 335L167 325M553 325L560 335L567 325M953 345L960 355L967 345" class="arrow"/><text x="330" y="125" class="edge" text-anchor="middle">read + write</text><text x="660" y="125" class="edge" text-anchor="middle">calls</text><text x="290" y="251" class="edge" text-anchor="middle">derives</text><text x="585" y="277" class="edge">invokes</text><text x="985" y="341" class="edge">pays</text><g><rect width="260" height="130" x="30" y="75" fill="#12151d" stroke="#9945ff" stroke-width="2" rx="16"/><text x="160" y="124" class="label" text-anchor="middle">Accounts</text><text x="160" y="160" class="meta" text-anchor="middle">Store onchain state</text></g><g><rect width="260" height="130" x="370" y="75" fill="#12151d" stroke="#7257f6" stroke-width="2" rx="16"/><text x="500" y="124" class="label" text-anchor="middle">Programs</text><text x="500" y="160" class="meta" text-anchor="middle">Define stateless logic</text></g><g><rect width="260" height="130" x="30" y="335" fill="#12151d" stroke="#9945ff" stroke-width="2" rx="16"/><text x="160" y="367" class="label-small" text-anchor="middle"><tspan x="160">Program-derived</tspan><tspan x="160" dy="22">addresses (PDAs)</tspan></text><text x="160" y="429" class="meta" text-anchor="middle">Provide deterministic addresses</text></g><g><rect width="260" height="130" x="370" y="335" fill="#12151d" stroke="#21d4fd" stroke-width="2" rx="16"/><text x="500" y="367" class="label-small" text-anchor="middle"><tspan x="500">Cross-program</tspan><tspan x="500" dy="22">invocations (CPIs)</tspan></text><text x="500" y="429" class="meta" text-anchor="middle">Call another program</text></g><g><rect width="400" height="280" x="760" y="35" fill="#12151d" stroke="#18d9ba" stroke-width="2" rx="18"/><text x="960" y="79" class="label" text-anchor="middle">Transactions</text><text x="960" y="111" class="meta" text-anchor="middle">Execute instructions atomically</text><rect width="310" height="120" x="805" y="145" fill="#0b0d12" stroke="#21d4fd" stroke-width="2" rx="14"/><text x="960" y="190" class="label" text-anchor="middle">Instructions</text><text x="960" y="228" class="meta" text-anchor="middle">Call one program</text></g><g><rect width="260" height="110" x="830" y="355" fill="#12151d" stroke="#14f195" stroke-width="2" rx="16"/><text x="960" y="400" class="label" text-anchor="middle">Fees</text><text x="960" y="437" class="meta" text-anchor="middle">Price transaction execution</text></g></svg>